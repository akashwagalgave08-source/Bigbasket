<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart - FreshBasket</title>

    <link
        rel="stylesheet"
        href="../CSS/style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body data-page="cart">


<header class="main-header">

    <div class="container header-content">

        <div class="logo">

            <a href="../index.html">

                <span>fresh</span>
                <strong>basket</strong>

            </a>

        </div>


        <a
            href="products.html"
            class="continue-shopping">

            <i class="fa-solid fa-arrow-left"></i>

            Continue Shopping

        </a>

    </div>

</header>


<main class="cart-page">

    <div class="container">

        <div class="cart-title">

            <div>

                <h1>
                    My Shopping Cart
                </h1>

                <p id="cartItemsCount">
                    0 items
                </p>

            </div>

        </div>


        <div
            class="cart-layout"
            id="cartLayout">


            <section class="cart-products">

                <div
                    id="cartItems">
                </div>

            </section>


            <aside class="cart-summary">

                <h2>
                    Order Summary
                </h2>


                <div class="coupon-box">

                    <input
                        id="couponInput"
                        placeholder="Enter coupon code">

                    <button
                        id="applyCoupon">

                        Apply

                    </button>

                </div>


                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <strong id="subtotal">
                        ₹0
                    </strong>

                </div>


                <div class="summary-row">

                    <span>
                        Delivery
                    </span>

                    <strong id="deliveryCharge">
                        ₹0
                    </strong>

                </div>


                <div class="summary-row discount-row">

                    <span>
                        Discount
                    </span>

                    <strong id="discount">
                        - ₹0
                    </strong>

                </div>


                <hr>


                <div class="summary-total">

                    <span>
                        Total
                    </span>

                    <strong id="grandTotal">
                        ₹0
                    </strong>

                </div>


                <a
                  href="checkout.html"
                  class="checkout-btn"
>
                  Proceed to Checkout
                 </a>


                <div class="secure-payment">

                    <i class="fa-solid fa-shield-halved"></i>

                    Secure & Safe Checkout

                </div>

            </aside>

        </div>


        <div
            class="empty-cart"
            id="emptyCart"
            style="display:none;">

            <i class="fa-solid fa-cart-shopping"></i>

            <h2>
                Your cart is empty
            </h2>

            <p>
                Looks like you haven't added
                anything to your cart yet.
            </p>

            <a
                href="products.html"
                class="primary-btn">

                Start Shopping

            </a>

        </div>

    </div>

</main>


<div
    class="toast"
    id="toast">

    <i class="fa-solid fa-circle-check"></i>

    <span id="toastMessage"></span>

</div>


<script src="../JS/script.js"></script>

</body>

</html>
