<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Order Confirmed - FreshBasket</title>

    <link
        rel="stylesheet"
        href="../CSS/style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>


<main class="order-success">

    <div class="success-card">

        <div class="success-icon">

            <i class="fa-solid fa-check"></i>

        </div>


        <h1>
            Order Placed Successfully!
        </h1>


        <p>
            Thank you for shopping with FreshBasket.
        </p>


        <div id="orderDetails">
        </div>


        <div class="success-actions">

            <a
                href="products.html"
                class="primary-btn">

                Continue Shopping

            </a>

            <a
                href="../index.html"
                class="secondary-btn">

                Back to Home

            </a>

        </div>

    </div>

</main>


<script>

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const orders =
            JSON.parse(
                localStorage.getItem(
                    "orders"
                )
            ) || [];


        const order =
            orders[orders.length - 1];


        const container =
            document.getElementById(
                "orderDetails"
            );


        if (!order) return;


        container.innerHTML = `

            <div class="order-number">

                <span>
                    Order ID
                </span>

                <strong>
                    ${order.id}
                </strong>

            </div>


            <div class="order-number">

                <span>
                    Date
                </span>

                <strong>
                    ${order.date}
                </strong>

            </div>


            <div class="order-status">

                <i class="fa-solid fa-circle-check"></i>

                ${order.status}

            </div>

        `;

    }
);

</script>

</body>

</html>
