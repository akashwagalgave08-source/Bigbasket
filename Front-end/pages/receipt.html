<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Receipt - FreshBasket</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="receipt-page">
    <header class="main-header">
        <div class="container header-content">
            <div class="logo"><a href="../index.html"><span>fresh</span><strong>basket</strong></a></div>
            <a href="../index.html" class="continue-shopping"><i class="fa-solid fa-bag-shopping"></i> Continue shopping</a>
        </div>
    </header>
    <main class="receipt-wrap">
        <section class="receipt-card" id="receiptCard" aria-live="polite">
            <div class="receipt-loading">Loading your receipt…</div>
        </section>
    </main>
    <script src="../JS/receipt.js"></script>
</body>
</html>
